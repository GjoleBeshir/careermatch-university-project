services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: careermatch
      POSTGRES_USER: career
      POSTGRES_PASSWORD: careerpass
    ports:
      - "5432:5432"
    volumes:
      - career_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d careermatch"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  career_db:
