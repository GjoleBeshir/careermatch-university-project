[project]
name = "careermatch"
version = "1.0.0"
description = "Explainable job and internship recommendation system"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "SQLAlchemy>=2.0,<3", "psycopg2-binary>=2.9,<3", "python-dotenv>=1.0,<2", "pydantic>=2.9,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
