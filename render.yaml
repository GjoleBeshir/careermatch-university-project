# Render Blueprint: deploy both the FastAPI app and PostgreSQL from GitHub.
# IMPORTANT: Check Render pricing and database free-tier expiration before approval.
services:
  - type: web
    name: careermatch-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start_render.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careermatch-demo-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: careermatch-demo-db
    plan: free
    region: frankfurt
    databaseName: careermatch
    user: careerapp
